<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>
<style>
    body {
        background-color: #a49e9e;
        display: flex;
        margin: 0;
        padding: 16px;
        box-sizing: border-box;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        gap: 16px;
    }

    .box {
        background-color: #f0f0f0;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 300px;
        padding: 20px;
        border-radius: 10px;
        gap: 16px;
    }

    img {
        display: block;
        margin: 0 auto;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
    }

    .line {
        width: 100%;
        height: 1px;
        background-color: #adaaaa;
    }

    .stats {
        display: flex;
        gap: 20px;
        text-align: center;
    }

    .number {
        font-weight: bold;
        font-size: 20px;
        padding-bottom: 12px;
    }

    .btn {
        background-color: blue;
        color: white;
        padding: 10px 20px;
        border: none;
        width: 80%;
        border-radius: 5px;
    }
</style>

<body>
    <div class="box">
        <img src="images_html1.jpeg" alt="Placeholder Image" />
        <div class="name">Nguyễn Văn A</div>
        <div class="work">Full Stack Developer</div>
        <div class="content">
            Tôi là lập trình viên yêu thích ReactJS, Flutter và nodejs
        </div>
        <div class="line"></div>
        <div class="stats">
            <div>
                <div class="number">120</div>
                <div class="label">Project</div>
            </div>
            <div>
                <div class="number">350</div>
                <div class="label">Followers</div>
            </div>
        </div>
        <button class='btn'>Follow</button>
        <a href="https://www.facebook.com/" target="_blank" class="view">View portfolio</a>
    </div>
</body>

</html>
